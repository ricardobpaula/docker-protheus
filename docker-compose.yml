# version: "3.6"

services:
  license:
    #image: "ricardobpaula/license-dev-protheus:${RELEASE}"
    image: "totvsengpro/license-dev:3.7.0"
    container_name: protheus_license_${VERSION}
    environment:
      - TZ=${TIME_ZONE}
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5555"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  database:
    image: "ricardobpaula/mssql-dev-protheus:latest"
    container_name: protheus_mssql
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASS}
      - MSSQL_DB=${DB_NAME}
      - ACCEPT_EULA=Y
      - TZ=${TIME_ZONE}
    user: root
    ports:
      - ${DB_PORT}:1433
    volumes:
      - mssql-data:/var/opt/mssql/data
      - mssql-log:/var/opt/mssql/log
      - mssql-secrets:/var/opt/mssql/secrets
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P ${DB_PASS} -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
  dbaccess:
    image: "ricardobpaula/dbaccess-dev-protheus:${RELEASE}"
    container_name: protheus_dbaccess_${VERSION}
    ports:
      - "${DBACCESS_PORT}:7890"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_TYPE=${DB_TYPE}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - LICENSE_SERVER=${LICENSE_SERVER}_${VERSION}
      - TZ=${TIME_ZONE}
    depends_on:
      - database
      - license
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7890"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  appserver:
    image: "ricardobpaula/appserver-dev-protheus:${RELEASE}"
    container_name: protheus_appserver_${VERSION}
    volumes:
      - "${PROTHEUS_PATH}/protheus_data/:/opt/totvs/protheus/protheus_data/"
      - "${PROTHEUS_PATH}/apo/:/opt/totvs/protheus/apo/"
      - "${PROTHEUS_INI_MAIN}/appserver.ini:/opt/totvs/appserver/appserver_bkp.ini"
    ports:
      - "9999:9999"
      - "8080:8080"
    environment:
      - LICENSE_SERVER=${LICENSE_SERVER}_${VERSION}
      - DBACCESS_SERVER=${DBACCESS_SERVER}_${VERSION}
      - DBACCESS_ALIAS=${DB_NAME}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - TZ=${TIME_ZONE}
    depends_on:
      - dbaccess
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9999"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  appserver-rest:
    image: "ricardobpaula/appserver-dev-protheus:${RELEASE}"
    container_name: protheus_rest_${VERSION}
    volumes:
      - "${PROTHEUS_PATH}/protheus_data/:/opt/totvs/protheus/protheus_data/"
      - "${PROTHEUS_PATH}/apo/:/opt/totvs/protheus/apo/"
      - "${PROTHEUS_INI_REST}/appserver.ini:/opt/totvs/appserver/appserver_bkp.ini"
    ports:
      - "9998:9998"
      - "3000:3000"
    environment:
      - LICENSE_SERVER=${LICENSE_SERVER}_${VERSION}
      - DBACCESS_SERVER=${DBACCESS_SERVER}_${VERSION}
      - DBACCESS_ALIAS=${DB_NAME}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - TZ=${TIME_ZONE}
    depends_on:
      - dbaccess
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9998"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  smartview:
    image: "ricardobpaula/smartview-dev-protheus:${RELEASE}"
    container_name: protheus_smartview_${VERSION}
    environment:
      - SMARTVIEW_PORT=${SMARTVIEW_PORT}
    ports:
      - "${SMARTVIEW_PORT}:${SMARTVIEW_PORT}"
      - "${SMARTVIEW_PORT_ADMIN}:${SMARTVIEW_PORT_ADMIN}"
    depends_on:
      - dbaccess
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SMARTVIEW_PORT}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  mssql-data:
  mssql-log:
  mssql-secrets: