[dev]
RootPath=/opt/totvs/protheus/protheus_data/
SourcePath=/opt/totvs/protheus/apo
RPOCustom=/opt/totvs/protheus/apo/custom.rpo
StartPath=/system/ 
RpoDb=top
RpoLanguage=portuguese
RpoVersion=120
Trace=0
DbDataBase=MSSQL
DbServer={{DBACCESS_SERVER}}
DbALIAS={{DBACCESS_ALIAS}}
DbPort={{DBACCESS_PORT}}
TOPMEMOMEGA=1
FWTRACELOG=1
StartSysInDB=1

[Drivers]
active=tcp
APP_ENVIRONMENT=DEV

[tcp]
type=tcpip
port=9999

[TopConnect]
Database=MSSQL
Alias={{DBACCESS_ALIAS}}

[General]
;CanAcceptFSRemote=1
InstallPath=/totvs12/protheus/bin/appserver
CONSOLELOG=1
ConsoleFile=console.log
MaxStringSize=500
BuildKillUsers=1
APP_ENVIRONMENT=DEV
MAXSTRINGSIZE=10
GuestKillUser=1
MULTIPROTOCOLPORT=1
MULTIPROTOCOLPORTSECURE=1

[LOCKSERVER]
Enable=0
Server=NOCONFIG

[LICENSECLIENT]
Server={{LICENSE_SERVER}}
PORT=5555
LOGMESSAGES=0

[MAIL]
Protocol=SMTP
extendSMTP=1
authLogin=1
authNTLM=1
TLSVERSION=1
SSLVERSION=3
TRYPROTOCOLS=0

#[WEBAPP]
#Enable=1
#Port=8080

[webapp/webapp]
mpp=