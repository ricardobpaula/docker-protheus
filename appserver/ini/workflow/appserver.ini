[dev]
SourcePath=/opt/totvs/protheus/apo
RootPath=/opt/totvs/protheus/protheus_data/
RPOCustom=/opt/totvs/protheus/apo/custom.rpo
StartPath=/system/ 
RpoDb=top
RpoLanguage=portuguese
RpoVersion=120
Trace=0
DbDataBase=MSSQL
DbServer={{DBACCESS_SERVER}}
DbALIAS={{DBACCESS_ALIAS}}
DbPort={{DBACCESS_PORT}}
TOPMEMOMEGA=1
FWTRACELOG=1
StartSysInDB=1

[drivers]
active=tcp
MULTIPROTOCOLPORT=0
MULTIPROTOCOLPORTSECURE=0

[tcp]
type=tcpip
port=9996

[TopConnect]
Database=MSSQL
Alias={{DBACCESS_ALIAS}}

[General]
;CanAcceptFSRemote=1
InstallPath=/totvs12/protheus/bin/appserver
CONSOLELOG=1
ConsoleFile=console.log
MaxStringSize=500
BuildKillUsers=1
app_environment=dev
MAXSTRINGSIZE=10
GuestKillUser=1

[LOCKSERVER]
Enable=0
Server=NOCONFIG

[LICENSECLIENT]
Server={{LICENSE_SERVER}}
PORT=5555
LOGMESSAGES=0

[MAIL]
Protocol=SMTP
extendSMTP=1
authLogin=1
authNTLM=1
TLSVERSION=1
SSLVERSION=3
TRYPROTOCOLS=0

[ONSTART]
jobs=SchedulerWF
refreshrate=30

[SchedulerWF]
Main=WFONSTART
Environment=dev
nParms=4
parm1=99
parm2=01
parm3=dev
parm4=T